# tepkimvar — MinIO (yalnızca internal, dışarı açılmaz)
#
# Bu compose HİÇBİR portu host'a publish etmez. MinIO yalnızca Docker
# ağı üzerinden erişilebilir.
#
# ─── Coolify kurulum ───────────────────────────────────────────────
# 1. New Resource → Docker Compose → docker-compose.minio.yml
# 2. Environment:
#      MINIO_ROOT_USER=tepkimvar
#      MINIO_ROOT_PASSWORD=<güçlü şifre>
# 3. MinIO kaynağına DOMAIN EKLEMEYİN (public URL vermeyin).
# 4. tepkimvar app → Settings → Network (veya Advanced):
#      "Connect to Predefined Network" → tepkimvar-internal
#    (Coolify sürümüne göre menü adı değişebilir.)
#
# ─── App runtime env ───────────────────────────────────────────────
#   S3_ENDPOINT=http://minio:9000
#   S3_ACCESS_KEY_ID=<MINIO_ROOT_USER>
#   S3_SECRET_ACCESS_KEY=<MINIO_ROOT_PASSWORD>
#   S3_BUCKET=itirazvar
#   S3_REGION=us-east-1
#
# Host adı compose servis adıdır: minio

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    # Console yalnızca konteyner içi localhost — dış ağdan erişilemez.
    command: server /data --console-address "127.0.0.1:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-tepkimvar}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD zorunlu}"
    volumes:
      - minio-data:/data
    networks:
      - tepkimvar-internal
    # ports: YOK — bilerek eklenmedi (internet'e açılmaz)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  tepkimvar-internal:
    name: tepkimvar-internal
    driver: bridge

volumes:
  minio-data:
